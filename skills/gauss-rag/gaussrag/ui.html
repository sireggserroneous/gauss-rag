<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Gauss RAG</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
/* tokens: dataviz reference palette, dark instance. Text wears ink, marks wear series color. */
:root{color-scheme:dark;
 --page:#0d0d0d;--surface:#1a1a19;--ink:#ffffff;--ink2:#c3c2b7;--mute:#898781;--grid:#2c2c2a;--rule:#383835;--border:rgba(255,255,255,.10);
 --k-section:#3987e5;--k-term:#d95926;--k-doc:#199e70;   /* categorical slots 1-3, validated all-pairs on the dark surface */
 --dangling:#d03b3b;                                    /* status: critical — a reference to nothing */
 --mark:#c3c2b7;--dim:.08}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--page);color:var(--ink);font:13px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;display:grid;grid-template-rows:auto auto 1fr;height:100vh}
header{display:flex;gap:14px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--grid);flex-wrap:wrap}
header .brand{font-weight:600;letter-spacing:.2px}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:6px;overflow:hidden}
.seg button{background:transparent;color:var(--ink2);border:0;border-right:1px solid var(--rule);padding:6px 12px;cursor:pointer;font:inherit}
.seg button:last-child{border-right:0}.seg button:hover{color:var(--ink);background:rgba(255,255,255,.04)}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--page);font-weight:600}
select,input{background:var(--surface);color:var(--ink);border:1px solid var(--rule);border-radius:6px;padding:6px 10px;font:inherit}
#q{min-width:300px}input::placeholder{color:var(--mute)}
label.tog{color:var(--ink2);display:inline-flex;gap:6px;align-items:center;cursor:pointer}
.stat{padding:6px 16px;color:var(--mute);border-bottom:1px solid var(--grid);font-variant-numeric:tabular-nums}
main{display:grid;grid-template-columns:240px 1fr 400px;min-height:0}
#explorer{border-right:1px solid var(--grid);background:var(--page);display:flex;flex-direction:column;min-height:0}
#tree{flex:1;overflow:auto;padding:10px 8px}
.folder .fh{display:flex;align-items:center;gap:6px;padding:5px 8px;border-radius:5px;color:var(--ink2);cursor:pointer;user-select:none}
.folder .fh:hover{background:rgba(255,255,255,.05)}
.folder .fh .chev{display:inline-block;width:10px;color:var(--mute);transition:transform .12s;font-size:10px}
.folder.closed .fh .chev{transform:rotate(-90deg)}.folder.closed .files{display:none}
.files{margin-left:13px;border-left:1px solid var(--grid);padding-left:4px}
.file{display:flex;align-items:center;gap:8px;padding:4px 10px;border-radius:5px;color:var(--ink2);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.file:hover{background:rgba(255,255,255,.05)}.file.on{background:rgba(255,255,255,.11);color:var(--ink)}
.file .dot{flex:0 0 6px;width:6px;height:6px;border-radius:50%;background:var(--dangling)}
#vault{padding:10px 16px;border-top:1px solid var(--grid);font-weight:600;color:var(--ink2);display:flex;justify-content:space-between;align-items:center}
#vault small{color:var(--mute);font-weight:400}
#stage{position:relative;overflow:hidden;background:var(--surface)}#stage.scroll{overflow:auto}#stage.scroll #svg{height:auto;cursor:default}
#svg{width:100%;height:100%;display:block;cursor:grab}#svg:active{cursor:grabbing}
#panel{border-left:1px solid var(--grid);overflow:auto;padding:14px 16px;background:var(--page)}
#panel h2{margin:0 0 4px;font-size:14px;font-weight:600}#panel h3{margin:16px 0 6px;font-size:11px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;color:var(--mute)}
#panel .sub{color:var(--mute);font-size:12px}#panel pre{white-space:pre-wrap;font:12.5px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--ink2);margin:10px 0 0}
.row{display:flex;gap:10px;align-items:baseline;padding:6px 8px;margin:2px -8px;border-radius:6px;cursor:pointer}
.row:hover{background:rgba(255,255,255,.05)}.row.on{background:rgba(255,255,255,.08)}
.row .k{flex:0 0 14px;height:2px;border-radius:1px;margin-top:8px;background:var(--mark)}
.row .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.row .m{color:var(--mute);font-size:12px;white-space:nowrap;font-variant-numeric:tabular-nums}
.legend{position:absolute;left:14px;bottom:12px;display:flex;gap:14px;color:var(--mute);font-size:12px;pointer-events:none}
.legend i{display:inline-block;width:14px;height:2px;vertical-align:middle;margin-right:6px;border-radius:1px}
.hint{position:absolute;right:14px;bottom:12px;color:var(--mute);font-size:12px;pointer-events:none}
#tip{position:absolute;pointer-events:none;background:var(--page);border:1px solid var(--rule);border-radius:6px;padding:8px 10px;font-size:12px;max-width:340px;display:none;box-shadow:0 6px 24px rgba(0,0,0,.5)}
#tip b{display:block;color:var(--ink);font-weight:600;margin-bottom:2px}#tip span{color:var(--ink2)}
svg text{fill:var(--ink2);font:11px system-ui,sans-serif;pointer-events:none}
svg text.doc{fill:var(--ink)}svg text.head{fill:var(--mute);font-size:11px;letter-spacing:.6px;text-transform:uppercase}
svg .hit{fill:transparent;stroke:transparent;cursor:pointer}
svg .chord{fill:none;stroke-linecap:round;transition:opacity .12s,stroke-width .12s}
svg .mark{transition:opacity .12s}
</style></head><body>
<header>
 <span class="brand">Gauss RAG</span>
 <span class="seg" id="tabs" role="tablist"></span>
 <input id="q" placeholder="Search — Enter for hits and the construct plan" aria-label="search">
 <label class="tog"><input type="checkbox" id="an"> analysis</label>
</header>
<div class="stat" id="stat">loading…</div>
<main>
 <nav id="explorer" aria-label="documents"><div id="tree"></div><div id="vault">Gauss <small id="vcount"></small></div></nav>
 <div id="stage"><svg id="svg" viewBox="0 0 1200 800" role="img" aria-label="knot visualization"></svg>
  <div class="legend" id="legend"></div><div class="hint" id="hint">scroll to zoom · drag to pan · click to select · Esc clears</div><div id="tip"></div></div>
 <aside id="panel"><h2>Gauss RAG</h2><div class="sub">Pick a view. Hover for detail, click to select, search to light the reading order.</div></aside>
</main>
<script>
'use strict';
// ── state ────────────────────────────────────────────────────────────────────
let K=null, view='tangle', doc=null, sel=null, hi=null, AN=null, docOf=[], hover=null;
const $=id=>document.getElementById(id), svg=$('svg'), panel=$('panel'), tip=$('tip');
const KC={section:'var(--k-section)',term:'var(--k-term)',doc:'var(--k-doc)'};
const KNAME={section:'section reference',term:'defined term',doc:'cross-document'};
const NS='http://www.w3.org/2000/svg';
const el=(n,a={},txt)=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);if(txt!=null)e.textContent=txt;return e;};
const leaf=l=>l.split(' › ').pop(), docName=d=>d.replace(/\.[^.]+$/,'').replace(/^.*\//,''), group=d=>d.includes('/')?d.split('/')[0]:'docs';
const P=(cx,cy,r,a)=>[cx+r*Math.cos(a),cy+r*Math.sin(a)];
function css(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim()}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
// ── data ─────────────────────────────────────────────────────────────────────
async function loadK(){
 K=await (await fetch('/knot.json')).json(); docOf=[];
 for(const [d,arcs] of Object.entries(K.docs)) for(const i of arcs) docOf[i]=d;
 const names=Object.keys(K.docs).sort((a,b)=>group(a).localeCompare(group(b))||a.localeCompare(b));
 doc=doc&&K.docs[doc]?doc:names.slice().sort((a,b)=>K.docs[b].length-K.docs[a].length)[0]; buildTree(names);
 $('stat').textContent=`${K.labels.length} sections · ${names.length} documents · ${K.crossings.length} crossings · ${K.dangling.length} dangling references`;
 // hash routing: #tangle | #knot | #simple | #doc, optionally #knot:<doc>
 const h=location.hash.slice(1); if(h){const [v,d]=h.split(':'); if(VIEWS[v])view=v; if(d&&K.docs[decodeURIComponent(d)])doc=decodeURIComponent(d);}
 render();
}
function openDoc(d){doc=d;hi=null;sel=(view==='tangle'||view==='simple')?d:null;render();listDoc(d);}
function buildTree(names){const tree=$('tree');tree.replaceChildren();const byG={};for(const d of names)(byG[group(d)]=byG[group(d)]||[]).push(d);
 for(const [g,files] of Object.entries(byG)){const f=document.createElement('div');f.className='folder';const fh=document.createElement('div');fh.className='fh';
  const ch=document.createElement('span');ch.className='chev';ch.textContent='▾';const nm=document.createElement('span');nm.textContent=g;const ct=document.createElement('span');ct.className='m';ct.style.marginLeft='auto';ct.style.color='var(--mute)';ct.textContent=files.length;
  fh.append(ch,nm,ct);fh.onclick=()=>f.classList.toggle('closed');const list=document.createElement('div');list.className='files';
  for(const d of files){const r=document.createElement('div');r.className='file';r.dataset.doc=d;r.title=d;const t=document.createElement('span');t.textContent=docName(d);t.style.overflow='hidden';t.style.textOverflow='ellipsis';r.appendChild(t);
   if(K.dangling.some(z=>docOf[z.over]===d)){const dot=document.createElement('span');dot.className='dot';dot.title='has dangling references';r.appendChild(dot);}
   r.onclick=()=>openDoc(d);list.appendChild(r);}
  f.append(fh,list);tree.appendChild(f);}
 $('vcount').textContent=`${names.length} files`;syncTree();}
function syncTree(){for(const r of document.querySelectorAll('#tree .file'))r.classList.toggle('on',r.dataset.doc===doc);}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){sel=null;hi=null;render();}});
// ── view registry: add a function here and a tab appears ─────────────────────
const VIEWS={simple:drawSimple, doc:drawDocView, knot:drawKnot, tangle:drawTangle};
const tabs=$('tabs');
for(const v of Object.keys(VIEWS)){const b=document.createElement('button');b.textContent=v;b.setAttribute('role','tab');b.onclick=()=>{view=v;sel=null;location.hash=v;render()};tabs.appendChild(b);}
let VB={x:0,y:0,w:1200,h:800};
function render(){
 for(const b of tabs.children)b.setAttribute('aria-pressed',String(b.textContent===view));
 svg.replaceChildren(); VB={x:0,y:0,w:1200,h:800}; svg.setAttribute('viewBox','0 0 1200 800'); svg.removeAttribute('width'); svg.removeAttribute('height'); $('stage').classList.toggle('scroll',view==='simple');
 VIEWS[view](); legend(); syncTree();
}
function legend(){
 const L=$('legend'); L.replaceChildren();
 for(const [k,name] of Object.entries(KNAME)){const s=document.createElement('span');const i=document.createElement('i');i.style.background=KC[k];s.appendChild(i);s.appendChild(document.createTextNode(name));L.appendChild(s);}
 const s=document.createElement('span');const i=document.createElement('i');i.style.background='var(--dangling)';s.appendChild(i);s.appendChild(document.createTextNode('dangling'));L.appendChild(s);
 if(hi){const s2=document.createElement('span');const i2=document.createElement('i');i2.style.background='var(--ink)';s2.appendChild(i2);s2.appendChild(document.createTextNode('construct path'));L.appendChild(s2);}
}
// ── zoom / pan on the viewBox ────────────────────────────────────────────────
svg.addEventListener('wheel',e=>{e.preventDefault();const r=svg.getBoundingClientRect();const mx=VB.x+(e.clientX-r.left)/r.width*VB.w,my=VB.y+(e.clientY-r.top)/r.height*VB.h;const f=e.deltaY>0?1.12:1/1.12;
 VB={x:mx-(mx-VB.x)*f,y:my-(my-VB.y)*f,w:VB.w*f,h:VB.h*f};svg.setAttribute('viewBox',`${VB.x} ${VB.y} ${VB.w} ${VB.h}`);},{passive:false});
let drag=null;svg.addEventListener('pointerdown',e=>{if(e.target===svg||e.target.tagName==='svg')drag={x:e.clientX,y:e.clientY,vb:{...VB}}});
svg.addEventListener('pointermove',e=>{if(!drag)return;const r=svg.getBoundingClientRect();VB.x=drag.vb.x-(e.clientX-drag.x)/r.width*VB.w;VB.y=drag.vb.y-(e.clientY-drag.y)/r.height*VB.h;svg.setAttribute('viewBox',`${VB.x} ${VB.y} ${VB.w} ${VB.h}`)});
window.addEventListener('pointerup',()=>drag=null);
// ── tooltip (textContent only) ───────────────────────────────────────────────
function showTip(e,title,lines){tip.replaceChildren();const b=document.createElement('b');b.textContent=title;tip.appendChild(b);for(const l of lines){const s=document.createElement('span');s.textContent=l;tip.appendChild(s);tip.appendChild(document.createElement('br'));}
 tip.style.display='block';const r=$('stage').getBoundingClientRect();tip.style.left=Math.min(e.clientX-r.left+14,r.width-360)+'px';tip.style.top=(e.clientY-r.top+14)+'px';}
function hideTip(){tip.style.display='none'}
async function showDoc(i){const d=await (await fetch('/doc?idx='+i)).json();panel.replaceChildren();
 const h=document.createElement('h2');h.textContent=leaf(d.label);const sub=document.createElement('div');sub.className='sub';sub.textContent=`${d.doc} · section ${d.pos+1}`;
 const pre=document.createElement('pre');pre.textContent=d.text;panel.append(h,sub,pre);
 const xs=K.crossings.filter(x=>x.over===i||x.under===i); if(xs.length){const h3=document.createElement('h3');h3.textContent='connected';panel.appendChild(h3);
  for(const x of xs){const o=x.over===i;const j=o?x.under:x.over;row(panel,KC[x.kind],`${o?'→':'←'} ${leaf(K.labels[j])}`,`${x.label}`,()=>showDoc(j));}}}
function row(parent,color,text,meta,onclick,on){const r=document.createElement('div');r.className='row'+(on?' on':'');const k=document.createElement('span');k.className='k';k.style.background=color;const t=document.createElement('span');t.className='t';t.textContent=text;const m=document.createElement('span');m.className='m';m.textContent=meta||'';r.append(k,t,m);if(onclick)r.onclick=onclick;parent.appendChild(r);return r;}
// ── shared: emphasis. sel = selected chunk idx (knot) or doc (tangle/simple); hi = Set of chunk idx (construct) ──
function focus(i){ // opacity for a chunk mark under current selection / highlight
 if(hi) return hi.has(i)?1:0.15;
 if(sel!=null){ if(typeof sel==='number'){ if(i===sel)return 1; return K.crossings.some(x=>(x.over===sel&&x.under===i)||(x.under===sel&&x.over===i))?1:0.18; } }
 return 1;
}
// ── KNOT: one document as a ring ─────────────────────────────────────────────
function drawKnot(){
 const arcs=K.docs[doc]||[], n=arcs.length, cx=600,cy=410,R=300, pos={};
 arcs.forEach((i,k)=>pos[i]=-Math.PI/2+2*Math.PI*k/n);
 svg.appendChild(el('text',{x:24,y:32,class:'doc','font-size':13},docName(doc)));
 svg.appendChild(el('text',{x:24,y:50,class:'head'},`${n} section${n===1?'':'s'} · ${K.crossings.filter(x=>pos[x.over]!=null||pos[x.under]!=null).length} crossings`));
 svg.appendChild(el('circle',{cx,cy,r:R,fill:'none',stroke:'var(--grid)','stroke-width':1}));
 const g=el('g'); svg.appendChild(g);
 for(const x of K.crossings){const a=pos[x.over],b=pos[x.under];
  if(a!=null&&b!=null){const [x1,y1]=P(cx,cy,R,a),[x2,y2]=P(cx,cy,R,b);const on=hi?(hi.has(x.over)&&hi.has(x.under)):(sel==null||x.over===sel||x.under===sel);
   const p=el('path',{d:`M${x1},${y1} Q${cx},${cy} ${x2},${y2}`,class:'chord',stroke:hi&&on?'var(--ink)':KC[x.kind],'stroke-width':on&&(sel!=null||hi)?2:1,opacity:on?(sel!=null||hi?.95:.5):.06});
   const hit=el('path',{d:p.getAttribute('d'),class:'hit chord','stroke-width':12});hit.onpointermove=e=>showTip(e,`${x.label}`,[KNAME[x.kind],`${leaf(K.labels[x.over])}  →  ${leaf(K.labels[x.under])}`]);hit.onpointerleave=hideTip;g.append(p,hit);}
  else if(a!=null||b!=null){const ang=a??b,[x1,y1]=P(cx,cy,R,ang),[x2,y2]=P(cx,cy,R+16,ang);const other=a!=null?x.under:x.over;
   const l=el('line',{x1,y1,x2,y2,class:'chord',stroke:'var(--k-doc)','stroke-width':1.5,opacity:.8});const hit=el('line',{x1,y1,x2,y2,class:'hit','stroke-width':14});hit.onpointermove=e=>showTip(e,x.label,['cross-document → '+docOf[other]]);hit.onpointerleave=hideTip;g.append(l,hit);}}
 for(const d of K.dangling){const ang=pos[d.over];if(ang==null)continue;const [x1,y1]=P(cx,cy,R,ang),[x2,y2]=P(cx,cy,R+12,ang);
  const l=el('line',{x1,y1,x2,y2,stroke:'var(--dangling)','stroke-width':1.5});const hit=el('line',{x1,y1,x2,y2,class:'hit','stroke-width':14});hit.onpointermove=e=>showTip(e,'dangling reference',[d.label,'points to nothing in this knot']);hit.onpointerleave=hideTip;g.append(l,hit);}
 const showLabels=n<=44;
 arcs.forEach(i=>{const a=pos[i],[x,y]=P(cx,cy,R,a),o=focus(i),lit=hi?hi.has(i):i===sel;
  const c=el('circle',{cx:x,cy:y,r:lit?6:4,fill:lit?'var(--ink)':'var(--mark)',stroke:'var(--surface)','stroke-width':2,class:'mark',opacity:o});
  const hit=el('circle',{cx:x,cy:y,r:13,class:'hit'});hit.onpointermove=e=>showTip(e,leaf(K.labels[i]),[docName(doc),`section ${arcs.indexOf(i)+1} of ${n}`]);hit.onpointerleave=hideTip;hit.onclick=()=>{sel=sel===i?null:i;hi=null;render();showDoc(i)};
  g.append(c,hit);
  if((showLabels&&o===1)||lit){const [tx,ty]=P(cx,cy,R+24,a);const deg=a*180/Math.PI,left=Math.cos(a)<0;const t=el('text',{x:tx,y:ty,transform:`rotate(${left?deg+180:deg} ${tx} ${ty})`,'text-anchor':left?'end':'start','dominant-baseline':'middle',class:lit?'doc':''},leaf(K.labels[i]).slice(0,38));t.style.fontWeight=lit?'600':'400';g.appendChild(t);}});
}
// ── TANGLE: every document as an arc segment of ONE circle; references bundled per document pair ──
function drawTangle(){
 const names=Object.keys(K.docs).sort((a,b)=>group(a).localeCompare(group(b))||a.localeCompare(b));
 const cx=600,cy=420,R=290,GAP=0.006,total=names.reduce((s,d)=>s+Math.max(3,Math.sqrt(K.docs[d].length)),0);
 const seg={};let a=-Math.PI/2;
 for(const d of names){const w=(Math.max(3,Math.sqrt(K.docs[d].length))/total)*(2*Math.PI-GAP*names.length);seg[d]={a0:a,a1:a+w,mid:a+w/2};a+=w+GAP;}
 // group bands (outer), labelled
 const groups=[...new Set(names.map(group))];
 for(const gname of groups){const ds=names.filter(d=>group(d)===gname);const a0=seg[ds[0]].a0,a1=seg[ds[ds.length-1]].a1;const [x1,y1]=P(cx,cy,R+58,a0),[x2,y2]=P(cx,cy,R+58,a1);
  svg.appendChild(el('path',{d:`M${x1},${y1} A${R+58},${R+58} 0 ${a1-a0>Math.PI?1:0} 1 ${x2},${y2}`,fill:'none',stroke:'var(--rule)','stroke-width':1}));
  const m=(a0+a1)/2,[tx,ty]=P(cx,cy,R+74,m);const left=Math.cos(m)<0;const gt=el('text',{x:tx,y:ty,class:'head','text-anchor':'middle','dominant-baseline':'middle',transform:`rotate(${m*180/Math.PI+(left?-90:90)} ${tx} ${ty})`},gname);gt.style.fill='var(--ink2)';gt.style.fontSize='12px';gt.style.fontWeight='600';svg.appendChild(gt);}
 // aggregate crossings per doc pair
 const pair={};for(const x of K.crossings){const A=docOf[x.over],B=docOf[x.under];if(!A||!B||A===B)continue;const k=A<B?A+'|'+B:B+'|'+A;(pair[k]=pair[k]||{n:0,kinds:{},A,B}).n++;pair[k].kinds[x.kind]=(pair[k].kinds[x.kind]||0)+1;}
 const selDoc=typeof sel==='string'?sel:null, hiDocs=hi?new Set([...hi].map(i=>docOf[i])):null;
 const g=el('g');svg.appendChild(g);
 for(const p of Object.values(pair)){const [x1,y1]=P(cx,cy,R-4,seg[p.A].mid),[x2,y2]=P(cx,cy,R-4,seg[p.B].mid);const kind=Object.entries(p.kinds).sort((u,v)=>v[1]-u[1])[0][0];
  const on=hiDocs?(hiDocs.has(p.A)&&hiDocs.has(p.B)):(selDoc?(p.A===selDoc||p.B===selDoc):true);
  const path=el('path',{d:`M${x1},${y1} Q${cx},${cy} ${x2},${y2}`,class:'chord',stroke:hiDocs&&on?'var(--ink)':KC[kind],'stroke-width':on?Math.min(4,0.8+p.n*0.35):1,opacity:on?(selDoc||hiDocs?.9:.42):.05});
  const hit=el('path',{d:path.getAttribute('d'),class:'hit chord','stroke-width':12});hit.onpointermove=e=>showTip(e,`${docName(p.A)}  ↔  ${docName(p.B)}`,[`${p.n} reference${p.n>1?'s':''}`,...Object.entries(p.kinds).map(([k,n])=>`${n} ${KNAME[k]}`)]);hit.onpointerleave=hideTip;g.append(path,hit);}
 // document segments + rim labels (documents only; sections live in the tooltip / doc view)
 for(const d of names){const s=seg[d],[x1,y1]=P(cx,cy,R,s.a0),[x2,y2]=P(cx,cy,R,s.a1),[x3,y3]=P(cx,cy,R+10,s.a1),[x4,y4]=P(cx,cy,R+10,s.a0);
  const on=hiDocs?hiDocs.has(d):(selDoc?(d===selDoc||Object.values(pair).some(p=>(p.A===selDoc&&p.B===d)||(p.B===selDoc&&p.A===d))):true);
  const dang=K.dangling.filter(z=>docOf[z.over]===d).length;
  const arc=el('path',{d:`M${x1},${y1} A${R},${R} 0 0 1 ${x2},${y2} L${x3},${y3} A${R+10},${R+10} 0 0 0 ${x4},${y4} Z`,fill:d===selDoc?'var(--ink)':'var(--mark)',stroke:'var(--surface)','stroke-width':1.5,class:'mark hit',opacity:on?1:.22});

// ── SIMPLE: documents as boxes in folder columns; references as edge-to-edge curves ──
function drawSimple(){

 const pos={};groups.forEach((gn,ci)=>{const x=PADL+ci*(COLW+GAPX);svg.appendChild(el('text',{x,y:26,class:'head'},gn));svg.appendChild(el('line',{x1:x,y1:38,x2:x+COLW,y2:38,stroke:'var(--rule)','stroke-width':1.5}));

 const g=el('g');svg.appendChild(g);
 for(const p of Object.values(pair)){const a=pos[p.A],b=pos[p.B];const back=b.x<a.x,same=b.x===a.x;const x1=same?a.x+a.w:(back?a.x:a.x+a.w),y1=a.y+a.h/2,x2=same?b.x+b.w:(back?b.x+b.w:b.x),y2=b.y+b.h/2;const mx=same?x1+40:(x1+x2)/2;
  const on=!near||(near.has(p.A)&&near.has(p.B));const kind=Object.entries(p.kinds).sort((u,v)=>v[1]-u[1])[0][0];

  const hit=el('path',{d:path.getAttribute('d'),class:'hit chord','stroke-width':12});hit.onpointermove=e=>showTip(e,`${docName(p.A)}  →  ${docName(p.B)}`,[`${p.n} reference${p.n>1?'s':''}`,...Object.entries(p.kinds).map(([k,n])=>`${n} ${KNAME[k]}`)]);hit.onpointerleave=hideTip;g.append(path,hit);}
 for(const d of names){const p=pos[d],on=!near||near.has(d),dang=K.dangling.filter(z=>docOf[z.over]===d).length,out=Object.values(pair).filter(q=>q.A===d).reduce((s,q)=>s+q.n,0),inn=Object.values(pair).filter(q=>q.B===d).reduce((s,q)=>s+q.n,0);
  const box=el('g',{class:'hit',opacity:on?1:.22});box.appendChild(el('rect',{x:p.x,y:p.y,width:p.w,height:p.h,rx:6,fill:'var(--page)',stroke:d===selDoc?'var(--ink)':'var(--rule)','stroke-width':d===selDoc?2:1}));
  box.appendChild(el('rect',{x:p.x,y:p.y,width:4,height:p.h,rx:2,fill:dang?'var(--dangling)':'var(--mark)'}));
  box.appendChild(el('text',{x:p.x+14,y:p.y+19,class:'doc'},docName(d).slice(0,30)));
  box.appendChild(el('text',{x:p.x+14,y:p.y+35,class:'head'},`${K.docs[d].length} sections · ${out}→ ${inn}←${dang?` · ${dang} dangling`:''}`));
  box.onpointermove=e=>showTip(e,docName(d),[d,`${K.docs[d].length} sections`,`${out} references out · ${inn} in`,...(dang?[`${dang} dangling`]:[])]);box.onpointerleave=hideTip;

}
